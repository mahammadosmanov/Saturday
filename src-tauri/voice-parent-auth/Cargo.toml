[package]
name = "saturday-voice-parent-auth"
version = "0.3.1"
edition = "2021"
build = "build.rs"

[features]
default = []
inspect-signed-code = []

[[bin]]
name = "voice-parent-auth-inspect"
path = "src/bin/inspect_signed_code.rs"
required-features = ["inspect-signed-code"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
