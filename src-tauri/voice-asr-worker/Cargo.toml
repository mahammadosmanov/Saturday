[package]
name = "saturday-voice-asr-worker"
version = "0.3.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "saturday-voice-asr-worker"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
libc = "0.2"
saturday-voice-parent-auth = { path = "../voice-parent-auth" }
saturday-voice-types = { path = "../voice-types" }
saturday-voice-worker-protocol = { path = "../voice-worker-protocol" }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
saturday-voice-parent-auth = { path = "../voice-parent-auth" }
