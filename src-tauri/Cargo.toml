[workspace]
members = [".", "voice-types", "voice-worker-protocol", "voice-parent-auth", "voice-asr-worker", "voice-llm-worker"]
default-members = ["."]
resolver = "2"

[package]
name = "saturday"
version = "0.3.1"
description = "Saturday local-first command interface"
edition = "2021"
default-run = "saturday"

[features]
default = []
fixture-helper = []
runtime-helper = []

[[bin]]
name = "saturday"
path = "src/main.rs"

[[bin]]
name = "saturday-helper-fixture"
path = "src/bin/saturday-helper-fixture.rs"
required-features = ["fixture-helper"]

[[bin]]
name = "saturday-runtime-helper"
path = "src/bin/saturday-runtime-helper.rs"
required-features = ["runtime-helper"]

[[test]]
name = "helper_boundary"
path = "tests/helper_boundary.rs"
required-features = ["fixture-helper"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
getrandom = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
saturday-voice-worker-protocol = { path = "voice-worker-protocol" }
saturday-voice-parent-auth = { path = "voice-parent-auth" }
saturday-voice-types = { path = "voice-types" }
sha2 = "0.10"
unicode-normalization = "0.1"
thiserror = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
